events {
    # The events block is required but can be left empty for basic configurations.
}

# Settings for handling HTTP traffic.
http {
    # MIME types for various file extensions.
    include       mime.types;

    # Default MIME type for files when the type is not determined.
    default_type  application/octet-stream;

    # Custom log format called 'main' for access logs.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # The file and format for access logs.
    access_log  /var/log/nginx/access.log  main;

    # Tile and log level for error logs.
    error_log   /var/log/nginx/error.log warn;

    # Use sendfile for efficient file transfer.
    sendfile        on;

    # Timeout for persistent connections with the client.
    keepalive_timeout  65;


    # An upstream group for the consigliere service.
    upstream consigliere {
        server app:8000;
    }


    server {
        # Explicit DNS resolver
        resolver 127.0.0.11 ipv6=off;

        # This server listens on port 80.
        listen 80;

        # Domain name for this server.
        server_name localhost;

        location / {

           # Use a variable for the proxy_pass
           set $upstream http://app:8000;
           proxy_pass $upstream;
           # Set various headers to forward to the upstream server.
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}