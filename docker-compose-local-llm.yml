version: "3.9"

services:
  # hookdeck container
  hookdeck:
    container_name: hookdeck
    image: hookdeck/hookdeck-cli:v1.5.0
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        # Check for existing config, log in if needed
        [ -f $HOME/.config/hookdeck/config.toml ] && echo "Hookdeck config found!" || /bin/hookdeck login
        # Start the listen command
        /bin/hookdeck listen app:8000 telegram
    volumes:
      - hookdeck_data:/root/.config/hookdeck
    tty: true
    restart: always

  # Redis container
  redis:
    container_name: redis
    image: redis/redis-stack:7.4.0-v8
    ports:
      - "6379:6379"
      - "8001:8001"
    restart: always

  # RDBMS container
  db:
    container_name: db
    image: postgres:14.17-bookworm
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust

  # LLM provider
  ollama:
    container_name: ollama
    image: ollama/ollama:0.13.4
    restart: always
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  app:
    container_name: app
    build: .
    volumes:
      - knowledge_data:/app/data/knowledge
    ports:
      - "8000:8000"
    tty: true
    depends_on:
      - redis
      - hookdeck
      - db
      - ollama

volumes:
  postgres_data:
    external: true
  hookdeck_data:
    external: true
  knowledge_data:
    external: true
  ollama_data:
    external: true