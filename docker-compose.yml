version: "3.9"

services:
  # Redis container
  redis:
    container_name: redis
    image: redis/redis-stack:7.4.0-v8
    ports:
      - "6379:6379"
      - "8001:8001"
    restart: always

  # LLM provider
  ollama:
    container_name: ollama
    image: ollama/ollama:0.13.4
    restart: always
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  ollama_data:
    external: true
